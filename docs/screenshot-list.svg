<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="540" fill="#0d1117"/>
  <!-- top bar -->
  <rect width="960" height="64" fill="#161b22"/>
  <rect x="16" y="10" width="44" height="44" rx="22" fill="#34506b"/>
  <text x="70" y="38" fill="#c9d1d9" font-size="15" font-weight="700">CableClue</text>
  <text x="200" y="40" fill="#8b949e" font-size="12">← Projects · My project</text>
  <rect x="360" y="22" width="58" height="24" rx="6" fill="#1c2330" stroke="#2a3340"/><text x="374" y="38" fill="#c9d1d9" font-size="12">Rack</text>
  <rect x="418" y="22" width="54" height="24" rx="6" fill="#58a6ff"/><text x="432" y="38" fill="#fff" font-size="12">List</text>
  <text x="860" y="38" fill="#8b949e" font-size="12">v0.5.9</text>
  <!-- toolbar -->
  <rect x="0" y="64" width="960" height="40" fill="#161b22"/>
  <rect x="16" y="74" width="280" height="22" rx="6" fill="#0d1117" stroke="#2a3340"/><text x="26" y="89" fill="#5a6270" font-size="11">Filter…</text>
  <g font-size="11">
    <rect x="306" y="74" width="44" height="22" fill="#58a6ff"/><text x="316" y="89" fill="#fff">All</text>
    <rect x="350" y="74" width="46" height="22" fill="#1c2330" stroke="#2a3340"/><text x="360" y="89" fill="#c9d1d9">Free</text>
    <rect x="396" y="74" width="74" height="22" fill="#1c2330" stroke="#2a3340"/><text x="406" y="89" fill="#c9d1d9">Occupied</text>
  </g>
  <text x="690" y="89" fill="#8b949e" font-size="11">12 / 24 configured</text>
  <rect x="820" y="74" width="62" height="22" rx="6" fill="#1c2330" stroke="#2a3340"/><text x="830" y="89" fill="#c9d1d9" font-size="11">⬇ Export</text>
  <!-- chips -->
  <rect x="0" y="104" width="960" height="34" fill="#161b22"/>
  <g font-size="11">
    <rect x="16" y="111" width="74" height="20" rx="10" fill="#58a6ff"/><text x="28" y="125" fill="#fff">Switch A</text>
    <rect x="96" y="111" width="74" height="20" rx="10" fill="#1c2330" stroke="#2a3340"/><rect x="96" y="111" width="3" height="20" rx="1" fill="#2563eb"/><text x="106" y="125" fill="#c9d1d9">Switch B</text>
    <rect x="176" y="111" width="78" height="20" rx="10" fill="#1c2330" stroke="#2a3340"/><rect x="176" y="111" width="3" height="20" rx="1" fill="#0d9488"/><text x="186" y="125" fill="#c9d1d9">Patch 1</text>
  </g>
  <!-- table header -->
  <rect x="0" y="138" width="960" height="28" fill="#161b22"/>
  <g font-size="11" fill="#8b949e">
    <text x="16" y="156">Device</text><text x="120" y="156">Port</text><text x="170" y="156">Status</text><text x="250" y="156">PoE</text><text x="360" y="156">VLAN</text><text x="470" y="156">IP address</text><text x="600" y="156">MAC</text><text x="740" y="156">Client</text>
  </g>
  <!-- rows -->
  <g font-size="11" fill="#c9d1d9">
    <!-- selected/fill column highlight on IP -->
    <rect x="464" y="166" width="120" height="120" fill="rgba(88,166,255,0.10)" stroke="#58a6ff"/>
    <line x1="0" y1="194" x2="960" y2="194" stroke="#20242e"/>
    <line x1="0" y1="222" x2="960" y2="222" stroke="#20242e"/>
    <line x1="0" y1="250" x2="960" y2="250" stroke="#20242e"/>
    <line x1="0" y1="278" x2="960" y2="278" stroke="#20242e"/>
    <g>
      <text x="16" y="184">Switch A</text><text x="120" y="184">1</text>
      <rect x="166" y="173" width="60" height="16" rx="8" fill="none" stroke="#3fb950"/><text x="176" y="185" fill="#3fb950" font-size="10">occupied</text>
      <circle cx="252" cy="180" r="5" fill="#58a6ff"/><text x="264" y="184">PoE+</text>
      <circle cx="356" cy="180" r="5" fill="#378add"/><text x="368" y="184">10 · office</text>
      <text x="470" y="184">10.0.10.5</text><text x="600" y="184" fill="#8b949e">a4:bb:6e:…</text><text x="740" y="184">AP hal</text>
    </g>
    <g>
      <text x="16" y="212">Switch A</text><text x="120" y="212">2</text>
      <rect x="166" y="201" width="60" height="16" rx="8" fill="none" stroke="#3fb950"/><text x="176" y="213" fill="#3fb950" font-size="10">occupied</text>
      <circle cx="252" cy="208" r="5" fill="#58a6ff"/><text x="264" y="212">PoE+</text>
      <circle cx="356" cy="208" r="5" fill="#378add"/><text x="368" y="212">10 · office</text>
      <text x="470" y="212">10.0.10.6</text><text x="740" y="212">AP zaal</text>
    </g>
    <g fill="#8b949e">
      <text x="16" y="240">Switch A</text><text x="120" y="240">3</text>
      <rect x="166" y="229" width="36" height="16" rx="8" fill="#1c2330" stroke="#2a3340"/><text x="176" y="241" font-size="10">free</text>
      <text x="470" y="240" fill="#c9d1d9">10.0.10.7</text>
    </g>
    <g fill="#8b949e">
      <text x="16" y="268">Switch A</text><text x="120" y="268">4</text>
      <rect x="166" y="257" width="36" height="16" rx="8" fill="#1c2330" stroke="#2a3340"/><text x="176" y="269" font-size="10">free</text>
      <text x="470" y="268" fill="#c9d1d9">10.0.10.8</text>
    </g>
  </g>
  <!-- fill handle -->
  <rect x="579" y="281" width="8" height="8" fill="#58a6ff" stroke="#0d1117"/>
  <text x="600" y="320" fill="#8b949e" font-size="11" font-style="italic">Select cells, drag the fill handle down — IPs auto-increment.</text>
</svg>
